<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Đặt phòng đã chuyển — Mô Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
</head>
<body>
<div class="cong">
  <h1>Đặt phòng đã chuyển nhà</h1>
  <p class="muted">Lịch đặt phòng giờ nằm ở <b>Mô House Calendar</b> — một trang riêng, rộng hơn, có thêm báo cáo.
    Bạn không phải đăng nhập lại.</p>
  <a class="btn chinh" id="di" href="https://duykennguyen.github.io/mo-house-calendar/">Mở Mô House Calendar</a>
  <a class="btn chu" href="index.html">Về Mô Hub</a>
  <p class="muted" id="dem"></p>
</div>
<script>
// Địa chỉ lấy từ config.js để sau này đổi một chỗ duy nhất
const DICH = (window.MO_CONFIG && window.MO_CONFIG.CALENDAR_URL) || "https://duykennguyen.github.io/mo-house-calendar/";
document.getElementById("di").href = DICH;

// Tự chuyển sau 3 giây, trừ khi người dùng bấm nút trước
let con = 3;
const dem = document.getElementById("dem");
const nhip = setInterval(() => {
  dem.textContent = `Tự chuyển sau ${con} giây…`;
  if (con-- <= 0) { clearInterval(nhip); location.replace(DICH); }
}, 1000);
</script>
</body>
</html>
