<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Đặt phòng — Mô Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="gate" class="hide"></div>
<div id="app" class="hide">
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html"><b>Mô Hub</b><span>Đặt phòng</span></a>
      <div class="who" id="who"></div>
    </header>

    <div class="cong-cu">
      <select id="fNha"><option value="">Tất cả nhà</option></select>
      <select id="fCheDo">
        <option value="ngay">Theo ngày (90 ngày)</option>
        <option value="thang">Theo tháng (12 tháng)</option>
      </select>
      <button class="btn" id="lui">←</button>
      <button class="btn" id="nay">Hôm nay</button>
      <button class="btn" id="toi">→</button>
      <button class="btn chinh hide" id="them">Thêm booking</button>
    </div>

    <div class="chu-thich">
      <span class="giu_cho">Giữ chỗ</span>
      <span class="da_coc">Đã cọc</span>
      <span class="dang_o">Đang ở</span>
      <span class="ket_thuc">Đã kết thúc</span>
      <span id="phamVi" class="muted"></span>
    </div>

    <div class="lich" id="lich"></div>
    <p class="muted" id="trong"></p>
  </div>
</div>

<dialog id="dlgBooking">
  <div class="dau"><h3 id="bkTitle">Booking mới</h3><button class="btn chu" data-close>Đóng</button></div>
  <div class="than">
    <div class="hang">
      <div><label>Căn</label><select id="bUnit"></select></div>
      <div><label>Kiểu thuê</label><select id="bTerm">
        <option value="dai_han">Dài hạn (theo tháng)</option>
        <option value="ngan_han">Ngắn hạn (theo đêm)</option></select></div>
      <div><label>Ngày vào</label><input id="bStart" type="date"></div>
      <div><label>Ngày trả phòng</label><input id="bEnd" type="date"></div>
    </div>

    <label>Khách</label>
    <select id="bGuest"><option value="">— Chọn khách đã có —</option></select>
    <div class="hang" id="khachMoi">
      <div><label>hoặc thêm khách mới: tên</label><input id="bGuestName" placeholder="Nguyễn Văn A"></div>
      <div><label>số điện thoại</label><input id="bGuestPhone" placeholder="09…"></div>
    </div>

    <div class="hang">
      <div><label id="lblGia">Giá thuê mỗi tháng (đ)</label><input id="bRent" inputmode="numeric" placeholder="20000000"></div>
      <div><label>Tiền cọc (đ)</label><input id="bDeposit" inputmode="numeric"></div>
      <div><label>Trạng thái cọc</label><select id="bDepStatus">
        <option value="chua_nhan">Chưa nhận</option><option value="da_nhan">Đã nhận</option>
        <option value="da_hoan">Đã hoàn</option><option value="khau_tru">Khấu trừ</option></select></div>
      <div><label>Trạng thái booking</label><select id="bStatus">
        <option value="giu_cho">Giữ chỗ</option><option value="da_coc">Đã cọc</option>
        <option value="dang_o">Đang ở</option><option value="ket_thuc">Kết thúc</option>
        <option value="huy">Hủy</option></select></div>
      <div><label>Kênh</label><select id="bChannel">
        <option value="truc_tiep">Trực tiếp</option><option value="moi_gioi">Môi giới</option>
        <option value="airbnb">Airbnb</option><option value="booking">Booking.com</option>
        <option value="agoda">Agoda</option><option value="khac">Khác</option></select></div>
      <div><label>Môi giới (nếu có)</label><input id="bBroker"></div>
    </div>
    <label>Link hợp đồng (Google Drive)</label><input id="bContract" type="url" placeholder="https://drive.google.com/…">
    <label>Ghi chú</label><textarea id="bNote"></textarea>
    <p class="muted" id="bMsg"></p>
  </div>
  <div class="chan"><button class="btn" data-close>Hủy</button><button class="btn chinh" id="bSave">Lưu booking</button></div>
</dialog>

<dialog id="dlgChiTiet">
  <div class="dau"><h3 id="ctTitle">Chi tiết</h3><button class="btn chu" data-close>Đóng</button></div>
  <div class="than" id="ctBody"></div>
  <div class="chan" id="ctChan"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
const { sb, esc, $, toast, vnToday, ddmm, when } = Mo;

const TRANG_THAI = { giu_cho: "Giữ chỗ", da_coc: "Đã cọc", dang_o: "Đang ở", ket_thuc: "Đã kết thúc", huy: "Đã hủy" };
const COC = { chua_nhan: "Chưa nhận", da_nhan: "Đã nhận", da_hoan: "Đã hoàn", khau_tru: "Khấu trừ" };
const KENH = { truc_tiep: "Trực tiếp", moi_gioi: "Môi giới", airbnb: "Airbnb", booking: "Booking.com", agoda: "Agoda", khac: "Khác" };
const LOAI_TIEN = { tien_thue: "Tiền thuê", tien_coc: "Tiền cọc", dien_nuoc: "Điện nước", phi_khac: "Phí khác", hoan_coc: "Hoàn cọc" };

let me, props = [], units = [], bookings = [], guests = [], sua = null;
let cheDo = "ngay", mocDau = vnToday();          // ngày đầu tiên của khung nhìn
const SO_COT = { ngay: 90, thang: 12 }, RONG = { ngay: 34, thang: 92 };

// ---------- Tiện ích ngày ----------
const d2iso = (d) => d.toISOString().slice(0, 10);
const iso2d = (s) => new Date(s + "T00:00:00Z");
const themNgay = (s, n) => d2iso(new Date(iso2d(s).getTime() + n * 86400e3));
const themThang = (s, n) => {
  const d = iso2d(s), y = d.getUTCFullYear(), m = d.getUTCMonth() + n;
  const cuoiThang = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();     // ngày cuối của tháng đích
  return d2iso(new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), cuoiThang))));
};
const soThang = (a, b) => { const x = iso2d(a), y = iso2d(b);
  return (y.getUTCFullYear() - x.getUTCFullYear()) * 12 + (y.getUTCMonth() - x.getUTCMonth()); };
const soNgay = (a, b) => Math.round((iso2d(b) - iso2d(a)) / 86400e3);
const tien = (n) => (n === null || n === undefined || n === "") ? "—" : Number(n).toLocaleString("vi-VN") + " đ";
const soTu = (v) => { const n = String(v ?? "").replace(/\D/g, ""); return n ? Number(n) : null; };

Mo.gate(async (p) => {
  me = { ...p, canBook: ["admin", "manager"].includes(p.role), canView: ["admin", "manager", "viewer"].includes(p.role) };
  if (!me.canView) {
    $("#app").innerHTML = `<div class="wrap"><h1>Đặt phòng</h1>
      <p class="muted">Mục này dành cho quản trị viên, quản lý và chủ đầu tư. Tài khoản của bạn không được cấp quyền xem.</p>
      <p><a class="btn" href="index.html">Về Mô Hub</a></p></div>`;
    return;
  }
  if (me.canBook) $("#them").classList.remove("hide");
  document.querySelectorAll("dialog [data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));

  $("#fNha").onchange = render;
  $("#fCheDo").onchange = () => { cheDo = $("#fCheDo").value; mocDau = vnToday(); render(); };
  $("#nay").onclick = () => { mocDau = vnToday(); render(); };
  $("#lui").onclick = () => { mocDau = cheDo === "ngay" ? themNgay(mocDau, -30) : themThang(mocDau, -6); render(); };
  $("#toi").onclick = () => { mocDau = cheDo === "ngay" ? themNgay(mocDau, 30) : themThang(mocDau, 6); render(); };
  $("#them").onclick = () => moForm(null, units[0]?.id, vnToday());
  $("#bSave").onclick = luuBooking;
  $("#bUnit").onchange = () => {
    if (sua) return;                       // đang sửa thì giữ nguyên giá đã lưu
    const u = units.find((x) => x.id === $("#bUnit").value);
    if (u?.list_rent_month && $("#bTerm").value === "dai_han") $("#bRent").value = u.list_rent_month;
  };
  $("#bTerm").onchange = nhanGia;

  await load();
});

async function load() {
  const [rp, ru] = await Promise.all([
    sb.from("properties").select("id,name,sort").eq("active", true).order("sort"),
    sb.from("units").select("id,property_id,name,sort,list_rent_month").eq("active", true).order("sort"),
  ]);
  props = rp.data ?? []; units = ru.data ?? [];
  $("#fNha").innerHTML = `<option value="">Tất cả nhà</option>` +
    props.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("#bUnit").innerHTML = units.map((u) => `<option value="${u.id}">${esc(tenCan(u))}</option>`).join("");

  // Quản lý đọc bảng gốc (có khách); chủ đầu tư đọc view không có SĐT/giấy tờ
  const rb = me.canBook
    ? await sb.from("bookings").select("*, guests(full_name)").is("deleted_at", null).order("start_date")
    : await sb.from("bookings_viewer").select("*").order("start_date");
  bookings = (rb.data ?? []).map((b) => ({ ...b, guest_name: b.guest_name ?? b.guests?.full_name ?? null }));

  if (me.canBook) {
    guests = (await sb.from("guests").select("id,full_name,phone").order("full_name")).data ?? [];
    $("#bGuest").innerHTML = `<option value="">— Chọn khách đã có —</option>` +
      guests.map((g) => `<option value="${g.id}">${esc(g.full_name)}${g.phone ? " · " + esc(g.phone) : ""}</option>`).join("");
  }
  render();
}

const tenCan = (u) => {
  const p = props.find((x) => x.id === u.property_id);
  return (p ? p.name + " — " : "") + u.name;
};

// ---------- Vẽ lịch ----------
function render() {
  const loc = $("#fNha").value;
  const dsCan = units.filter((u) => !loc || u.property_id === loc);
  if (!dsCan.length) {
    $("#lich").innerHTML = "";
    $("#trong").textContent = "Chưa có căn nào. Quản trị viên thêm căn ở trang Quản lý nhà.";
    return;
  }
  $("#trong").textContent = "";

  const n = SO_COT[cheDo], w = RONG[cheDo];
  const cot = (i) => (cheDo === "ngay" ? themNgay(mocDau, i) : themThang(mocDau, i));
  const hetKhung = cheDo === "ngay" ? themNgay(mocDau, n) : themThang(mocDau, n);
  $("#phamVi").textContent = `${ddmm(mocDau)} → ${ddmm(hetKhung)}`;

  const grid = `grid-template-columns: 170px repeat(${n}, ${w}px)`;
  const homNay = vnToday();
  const THU = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

  // Hàng tiêu đề
  let html = `<div class="lich-hang dau" style="${grid}"><div class="ten-can">Căn</div>`;
  for (let i = 0; i < n; i++) {
    const d = cot(i), dt = iso2d(d), cuoi = [0, 6].includes(dt.getUTCDay());
    // Chỉ hiện số ngày cho đỡ chật; mùng 1 thì kèm tháng để biết đang ở tháng nào
    const nhan = d.slice(8) === "01" ? `1/${d.slice(5, 7)}` : String(Number(d.slice(8)));
    html += cheDo === "ngay"
      ? `<div class="nhan-ngay ${cuoi ? "nghi" : ""} ${d === homNay ? "nay" : ""}">${THU[dt.getUTCDay()]}<b>${nhan}</b></div>`
      : `<div class="nhan-ngay"><b>T${dt.getUTCMonth() + 1}</b>${dt.getUTCFullYear()}</div>`;
  }
  html += `</div>`;

  // Từng nhà → từng căn
  let nhaHienTai = null;
  for (const u of dsCan) {
    const p = props.find((x) => x.id === u.property_id);
    if (p && p.id !== nhaHienTai) {
      nhaHienTai = p.id;
      html += `<div class="lich-hang" style="${grid}"><div class="nha-nhom">${esc(p.name)}</div></div>`;
    }
    html += `<div class="lich-hang" style="${grid}" data-unit="${u.id}"><div class="ten-can">${esc(u.name)}</div>`;
    for (let i = 0; i < n; i++) {
      const d = cot(i), dt = iso2d(d), cuoi = cheDo === "ngay" && [0, 6].includes(dt.getUTCDay());
      html += `<div class="o-ngay ${cuoi ? "nghi" : ""} ${d === homNay ? "nay" : ""}" data-unit="${u.id}" data-ngay="${d}"></div>`;
    }
    html += `<div class="lop-thanh" style="left:170px">${thanhCuaCan(u.id, n, w)}</div></div>`;
  }
  $("#lich").innerHTML = html;

  $("#lich").onclick = (e) => {
    const bk = e.target.closest("[data-bk]");
    if (bk) return moChiTiet(Number(bk.dataset.bk));
    const o = e.target.closest(".o-ngay");
    if (o && me.canBook) moForm(null, o.dataset.unit, o.dataset.ngay);
  };
}

function thanhCuaCan(unitId, n, w) {
  const hetKhung = cheDo === "ngay" ? themNgay(mocDau, n) : themThang(mocDau, n);
  return bookings.filter((b) => b.unit_id === unitId && b.status !== "huy"
      && b.start_date < hetKhung && b.end_date > mocDau)
    .map((b) => {
      let i0, i1;
      if (cheDo === "ngay") { i0 = soNgay(mocDau, b.start_date); i1 = soNgay(mocDau, b.end_date); }
      else { i0 = soThang(mocDau, b.start_date); i1 = soThang(mocDau, themNgay(b.end_date, -1)) + 1; }
      i0 = Math.max(0, i0); i1 = Math.min(n, i1);
      const rong = Math.max(w * (i1 - i0) - 4, 26);
      const ten = b.guest_name || "(chưa ghi tên khách)";
      return `<button class="thanh ${b.status}" data-bk="${b.id}" style="left:${i0 * w + 2}px;width:${rong}px"
        title="${esc(ten)} · ${ddmm(b.start_date)}–${ddmm(b.end_date)} · ${TRANG_THAI[b.status]}">${esc(ten)}</button>`;
    }).join("");
}

function nhanGia() {
  $("#lblGia").textContent = $("#bTerm").value === "dai_han" ? "Giá thuê mỗi tháng (đ)" : "Tổng tiền thuê (đ)";
}

// ---------- Form booking ----------
function moForm(b, unitId, ngay) {
  sua = b;
  $("#bkTitle").textContent = b ? `Sửa booking #${b.id}` : "Booking mới";
  $("#bUnit").value = b?.unit_id ?? unitId ?? units[0]?.id;
  $("#bTerm").value = b?.term_type ?? "dai_han";
  $("#bStart").value = b?.start_date ?? ngay ?? vnToday();
  $("#bEnd").value = b?.end_date ?? themThang(ngay ?? vnToday(), 1);
  $("#bGuest").value = b?.guest_id ?? "";
  $("#bGuestName").value = ""; $("#bGuestPhone").value = "";
  const canDangChon = units.find((u) => u.id === $("#bUnit").value);
  $("#bRent").value = b?.rent_amount ?? canDangChon?.list_rent_month ?? "";
  $("#bDeposit").value = b?.deposit_amount ?? "";
  $("#bDepStatus").value = b?.deposit_status ?? "chua_nhan";
  $("#bStatus").value = b?.status ?? "giu_cho";
  $("#bChannel").value = b?.channel ?? "truc_tiep";
  $("#bBroker").value = b?.broker_name ?? "";
  $("#bContract").value = b?.contract_url ?? "";
  $("#bNote").value = b?.note ?? "";
  $("#bMsg").textContent = "";
  nhanGia();
  $("#dlgBooking").showModal();
}

async function luuBooking() {
  const row = {
    unit_id: $("#bUnit").value,
    start_date: $("#bStart").value,
    end_date: $("#bEnd").value,
    term_type: $("#bTerm").value,
    rent_amount: soTu($("#bRent").value),
    deposit_amount: soTu($("#bDeposit").value),
    deposit_status: $("#bDepStatus").value,
    status: $("#bStatus").value,
    channel: $("#bChannel").value,
    broker_name: $("#bBroker").value.trim() || null,
    contract_url: $("#bContract").value.trim() || null,
    note: $("#bNote").value.trim() || null,
    guest_id: $("#bGuest").value || null,
  };
  if (!row.unit_id) return ($("#bMsg").textContent = "Chọn căn trước đã.");
  if (!row.start_date || !row.end_date) return ($("#bMsg").textContent = "Điền ngày vào và ngày trả phòng.");
  if (row.end_date <= row.start_date) return ($("#bMsg").textContent = "Ngày trả phòng phải sau ngày vào.");

  $("#bSave").disabled = true;
  // Khách mới: tạo hồ sơ khách trước
  const tenMoi = $("#bGuestName").value.trim();
  if (tenMoi) {
    const { data: g, error: eg } = await sb.from("guests")
      .insert({ full_name: tenMoi, phone: $("#bGuestPhone").value.trim() || null }).select().single();
    if (eg) { $("#bSave").disabled = false; return ($("#bMsg").textContent = "Không lưu được khách: " + eg.message); }
    row.guest_id = g.id;
  }

  const { error } = sua
    ? await sb.from("bookings").update(row).eq("id", sua.id)
    : await sb.from("bookings").insert(row);
  $("#bSave").disabled = false;
  if (error) {
    $("#bMsg").textContent = error.code === "23P01"
      ? "Căn này đã có khách trong khoảng ngày đó. Chọn ngày khác hoặc căn khác."
      : "Lỗi: " + error.message;
    return;
  }
  $("#dlgBooking").close();
  toast(sua ? "Đã lưu booking" : "Đã tạo booking");
  await load();
}

// ---------- Chi tiết booking ----------
async function moChiTiet(id) {
  const b = bookings.find((x) => x.id === id);
  if (!b) return;
  const u = units.find((x) => x.id === b.unit_id);
  $("#ctTitle").textContent = `Booking #${b.id} — ${u ? tenCan(u) : ""}`;

  const [{ data: tt }, { data: nk }] = await Promise.all([
    sb.from("payments").select("*").eq("booking_id", id).order("due_date"),
    me.canBook ? sb.from("booking_log").select("*").eq("booking_id", id).order("at", { ascending: false })
               : Promise.resolve({ data: [] }),
  ]);
  const homNay = vnToday();
  const dong = (tt ?? []).map((t) => `
    <tr class="${t.amount_paid < t.amount_due && t.due_date < homNay ? "tre" : ""}">
      <td>${esc(t.period_label || LOAI_TIEN[t.kind] || t.kind)}</td>
      <td>${t.due_date ? ddmm(t.due_date) : "—"}</td>
      <td class="so">${tien(t.amount_due)}</td>
      <td class="so">${t.amount_paid ? tien(t.amount_paid) : "—"}</td>
      <td>${me.canBook && t.amount_paid < t.amount_due
        ? `<button class="btn nho reu" data-thu="${t.id}" data-so="${t.amount_due}">Đã thu</button>` : ""}</td>
    </tr>`).join("");

  $("#ctBody").innerHTML = `
    <p><b>${esc(b.guest_name || "(chưa ghi tên khách)")}</b> · ${ddmm(b.start_date)} → ${ddmm(b.end_date)}
      · ${b.term_type === "dai_han" ? "dài hạn" : "ngắn hạn"} · ${TRANG_THAI[b.status]}</p>
    <p class="muted">Giá: ${tien(b.rent_amount)}${b.term_type === "dai_han" ? "/tháng" : ""}
      · Cọc: ${tien(b.deposit_amount)} (${COC[b.deposit_status] ?? "—"})
      · Kênh: ${KENH[b.channel] ?? "—"}${b.broker_name ? " · " + esc(b.broker_name) : ""}</p>
    ${b.contract_url ? `<p><a href="${esc(b.contract_url)}" target="_blank" rel="noopener">Mở hợp đồng</a></p>` : ""}
    ${b.note ? `<p class="muted">${esc(b.note)}</p>` : ""}
    <h3>Lịch thu tiền</h3>
    ${dong ? `<table class="tien"><thead><tr><th>Kỳ</th><th>Hạn</th><th>Phải thu</th><th>Đã thu</th><th></th></tr></thead><tbody>${dong}</tbody></table>`
           : `<p class="muted">Chưa có lịch thu tiền.</p>`}
    ${nk?.length ? `<h3>Nhật ký</h3>${nk.map((l) => `<div class="log"><b>${esc(l.actor ?? "")}</b> ${esc(l.action)}<div class="khi">${when(l.at)}</div></div>`).join("")}` : ""}`;

  $("#ctChan").innerHTML = me.canBook ? `
    ${b.term_type === "dai_han" ? `<button class="btn" id="ctLich">Tạo lịch thu theo tháng</button>` : ""}
    <button class="btn" id="ctGiaHan">Gia hạn</button>
    <button class="btn" id="ctSua">Sửa</button>` : "";

  $("#ctBody").onclick = async (e) => {
    const id2 = e.target.dataset.thu;
    if (!id2) return;
    await sb.from("payments").update({ amount_paid: Number(e.target.dataset.so), paid_date: vnToday() }).eq("id", id2);
    toast("Đã ghi nhận khoản thu"); moChiTiet(id);
  };
  if (me.canBook) {
    const nutLich = $("#ctLich");
    if (nutLich) nutLich.onclick = async () => {
      const { data, error } = await sb.rpc("generate_rent_schedule", { p_booking: id });
      if (error) return toast("Lỗi: " + error.message);
      toast(`Đã tạo ${data} kỳ thu tiền`); moChiTiet(id);
    };
    $("#ctGiaHan").onclick = () => {
      $("#dlgChiTiet").close();
      moForm(null, b.unit_id, b.end_date);
    };
    $("#ctSua").onclick = () => { $("#dlgChiTiet").close(); moForm(b); };
  }
  $("#dlgChiTiet").showModal();
}
</script>
